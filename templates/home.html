{% extends "base.html" %}
{% load static %}

{% block titulo %}Home{% endblock titulo %}

{% block contenido %}
<!-- Page Header-->
        <header class="masthead" style="background-image: url('{% static "assets/img/home-bg.jpg" %}')">
            <div class="container position-relative px-4 px-lg-5">
                <div class="row gx-4 gx-lg-5 justify-content-center">
                    <div class="col-md-10 col-lg-8 col-xl-7">
                        <div class="site-heading">
                            <h1>Inicio</h1>
                            <span class="subheading">Blogs post</span>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- CONTENEDOR DONDE SE CARGARÁN LOS POSTS -->
        <div class="container px-4 px-lg-5">
            <div class="row gx-4 gx-lg-5 justify-content-center" id="posts-container">
            </div>
        </div>

{% endblock %}

{% block scripts %}
<script>

document.addEventListener("DOMContentLoaded", function(){

fetch("/blog/api/posts/")
.then(response => {
    if (!response.ok) {
        throw new Error("Error en la respuesta del servidor")
    }
    return response.json()
})
.then(data => {

    const container = document.getElementById("posts-container")

    data.forEach(post => {

        let deleteButton = ""

        if(post.can_delete){

            deleteButton = `
                <button onclick="deletePost(${post.id})" class="btn btn-danger">
                    Eliminar
                </button>

                <a href="/blog/editar_post/${post.id}/" class="btn btn-warning">
                    Editar
                </a>
            `
        }

        container.innerHTML += `

        <div class="container px-4 px-lg-5">

            <div class="row gx-4 gx-lg-5 justify-content-center">

                <div class="col-md-10 col-lg-8 col-xl-7">

                    <div class="post-preview">

                        <a href="/blog/post/${post.id}/">

                            <h2 class="post-title">${post.titulo}</h2>

                            <h3 class="post-subtitle">${post.contenido.substring(0,50)}}</h3>

                        </a>

                        <p class="post-meta">
                            Post Creado el ${post.created_at} por: ${post.autor}
                        </p>

                        ${deleteButton}

                    </div>

                </div>

            </div>

        </div>
        `
    })

})
.catch(error => {
    console.error("Error:", error)
})

})


// FUNCION ELIMINAR POST
function deletePost(postId){

    if(!confirm("¿Seguro que deseas eliminar este post?")){
        return
    }

    fetch(`/blog/api/eliminar_post/${postId}/`, {
        method: "DELETE",
        headers: {
            "X-CSRFToken": getCookie("csrftoken"),
        }
    })
    .then(response => {

        if(response.ok){
            alert("Post eliminado correctamente")
            location.reload()
        }else{
            alert("No se pudo eliminar el post")
        }

    })

}


// FUNCION CSRF
function getCookie(name) {

    let cookieValue = null;

    if (document.cookie && document.cookie !== "") {

        const cookies = document.cookie.split(";");

        for (let i = 0; i < cookies.length; i++) {

            const cookie = cookies[i].trim();

            if (cookie.substring(0, name.length + 1) === (name + "=")) {

                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));

                break;

            }
        }
    }

    return cookieValue;
}

</script>
{% endblock scripts %}
